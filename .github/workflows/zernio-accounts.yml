name: Find Zernio Threads Account ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-engine
      - name: List connected Threads accounts
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python -m tektizen zernio-accounts
